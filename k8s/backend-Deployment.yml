apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointybackend-deployment
  labels:
    app: appoinback
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appoinback
  template:
    metadata:
      labels:
        app: appoinback
    spec:
      containers:
      - name: backend
        image: mahmoud148/appointy-backend:latest
        ports:
          - containerPort: 4000
        envFrom:
          - configMapRef:
              name: backend-config
            # Loads sensitive keys/secrets into process.env
          - secretRef:
              name: backend-secrets     

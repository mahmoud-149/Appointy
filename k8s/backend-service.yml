apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP            # Default type; only reachable inside the cluster
  selector:
    app: appoinback          # Matches Deployment template.metadata.labels
  ports:
    - protocol: TCP
      port: 4000             # Service port Nginx will call
      targetPort: 4000       # Port the backend app listens on

name: ci
on:
  push:
    branches:
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -  name: Set up Docker Buildx
         uses: docker/setup-buildx-action@v4

          
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend                  # Path to backend folder
          file: ./backend/Dockerfile          # Dockerfile location
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/appointy-backend:latest

      # 2. Build and Push the Frontend
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend                 # Path to frontend folder
          file: ./frontend/Dockerfile         # Dockerfile location
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/appointy-frontend:latest    